# ═══════════════════════════════════════════════════════════════
# Fish-Agent  Application Configuration
# ═══════════════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────────────
server:
  port: 8080

# ── Spring Boot ──────────────────────────────────────────────
spring:
  profiles:
    # 默认 dev：自动加载 application-dev.yml（敏感凭据，gitignore）
    # 生产：SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: Fish-Agent

  threads:
    virtual: true

  output:
    ansi:
      enabled: always

  # 排除不需要的 OpenAI 自动配置（DeepSeek 仅需 Chat）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  # ── 数据源 ────────────────────────────────────────────────
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/fish_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:2}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  # ── AI 模型 ────────────────────────────────────────────────
  ai:
    # ChatModel 自动配置选择：dashscope | ollama | openai
    # 若未在任意 PropertySource 中设置 spring.ai.model.chat，
    # 由 FishLlmEnvironmentPostProcessor 根据 fish.llm.chat-provider 补全
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}
          dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1536}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}

    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}

  # ── Web / 邮件 ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${FISH_KNOWLEDGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${FISH_KNOWLEDGE_MAX_REQUEST_SIZE:55MB}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

# ── MyBatis-Plus ─────────────────────────────────────────────
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    reactor.netty.http.client: DEBUG
    com.yuyu.fishagent:
      agent: debug
      auth: debug
      chat: debug
      memory: debug
      rag: debug

# ── Resilience4j 熔断器 ────────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      llm:
        base-config: default
        slow-call-duration-threshold: 15s
        wait-duration-in-open-state: 60s
      es-text:
        base-config: default
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 20s
      es-vector:
        base-config: default
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
      rerank:
        base-config: default
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s

# ═══════════════════════════════════════════════════════════════
# Fish-Agent 业务配置
# ═══════════════════════════════════════════════════════════════
fish:

  # ── 模型路由 ────────────────────────────────────────────────
  llm:
    # DASHSCOPE | OLLAMA | DEEPSEEK
    chat-provider: ${FISH_LLM_CHAT_PROVIDER:DEEPSEEK}
    # 嵌入（仅 DASHSCOPE / OLLAMA，DeepSeek 不支持）
    embedding:
      provider: ${FISH_LLM_EMBEDDING_PROVIDER:DASHSCOPE}

  # ── Agent 行为 ─────────────────────────────────────────────
  agent:
    max-iterations: 10
    history-dir: data/history
    sandbox-dir: data/sandbox
    instruction: |-
      你是一个名为 Fish 的智能助手，擅长理解用户意图并合理使用工具来解决问题。
      回答时请保持简洁、准确；当工具返回结果后再总结给用户。
      若消息中出现可供参考的用户背景信息，请直接据此作答，像一直了解对方一样自然承接，不要先否认「不记得」再引用背景。
      勿在面向用户的句子中提及：长期记忆、记忆片段、检索结果、系统提示、上下文块、RAG、embedding 等技术或来源措辞；也不要用「根据你之前提供的…」「根据系统/上文…」这类元叙述。
      同一条系统消息开头的「当前会话时间」表示应用服务器此刻的本地时间；判断「今天、现在、最近」时以它为锚，不要凭训练直觉或搜索结果臆测当前公历日期。
      网络搜索返回的日期多为新闻发稿/事件发生时间或站点元数据，不等于「此刻」；不同搜索源索引新旧可能不一致，不要仅因某条摘要年份与直觉不符就断言真实日期。需要与用户时区对齐或二次确认时刻时，可调用工具 get_current_datetime（可传 IANA 时区）。

  # ── 记忆系统 ───────────────────────────────────────────────
  memory:
    short-term-window-size: 20
    summary-trigger-threshold: 30
    redis-key-prefix: fish:memory
    short-term-ttl-days: 30
    long-term-enabled: ${MEMORY_LONG_TERM_ENABLED:true}
    long-term-index-name: ${MEMORY_USER_INDEX:fish-user-memory}
    embedding-dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1536}
    # 长期事实写入前查重：避免同一用户反复沉淀高度相似事实
    dedup:
      enabled: ${FISH_MEMORY_DEDUP_ENABLED:true}
      similarity-threshold: ${FISH_MEMORY_DEDUP_THRESHOLD:0.92}
      k: 3
      num-candidates: 20
    # 记忆压缩 / 长期事实抽取专用 Chat（DEEPSEEK 下为独立 OpenAiChatModel）
    chat:
      enabled: ${MEMORY_CHAT_ENABLED:true}
      model: ${MEMORY_CHAT_MODEL:deepseek-chat}
      temperature: ${MEMORY_CHAT_TEMPERATURE:0.1}

  # ── RAG 检索增强 ───────────────────────────────────────────
  rag:
    enabled: ${FISH_RAG_ENABLED:true}
    rewrite-enabled: ${FISH_RAG_REWRITE_ENABLED:false}
    # 查询重写（仅 rewrite-enabled=true 时生效）：NONE | CHAT_MODEL
    rewrite-provider: CHAT_MODEL
    rewrite-temperature: 0.1
    rewrite-max-tokens: 256
    rewrite-max-chars: 512
    # 多查询召回（v3.4 扩大候选池）
    recall:
      max-sub-queries: 12
      min-token-chars: 1
      per-subquery-size: 10
      vector-leg-enabled: true
      knn-num-candidates: 120
    # 结果渲染上限
    render:
      max-injected-facts: 8
      max-injected-chars: 4000
    # RRF 分数融合（统一 BM25 / cosine 排名）
    fusion:
      enabled: ${FISH_RAG_FUSION_ENABLED:true}
      rrf-k: 60
      candidate-pool-size: 50
    # DashScope Cross-Encoder 精排（复用 DASHSCOPE_API_KEY，无 Key 自动降级）
    rerank:
      enabled: ${FISH_RAG_RERANK_ENABLED:true}
      model: ${FISH_RAG_RERANK_MODEL:qwen3-rerank}
      top-n: 8
      timeout-seconds: 5
      fallback-on-error: true
      base-url: https://dashscope.aliyuncs.com
      api-key: ${DASHSCOPE_API_KEY:}
    # 查询理解：LLM 语义分解 / TOKEN 词级扩展 / IDENTITY 原句
    expand:
      enabled: ${FISH_RAG_EXPAND_ENABLED:true}
      strategy: ${FISH_RAG_EXPAND_STRATEGY:LLM}
      max-queries: 4
      temperature: 0.3
      timeout-ms: 3000
      min-query-chars: 5
      max-query-chars: 200
    # HyDE：生成假设性答案，仅用于向量召回腿；默认关闭
    hyde:
      enabled: ${FISH_RAG_HYDE_ENABLED:false}
      max-tokens: 300
      temperature: 0.5
      timeout-ms: 3000
    # RAG 质量追踪：异步写 ES，便于观察召回、精排与注入效果
    tracing:
      enabled: ${FISH_RAG_TRACING_ENABLED:true}
      index-name: ${FISH_RAG_TRACE_INDEX:fish-rag-trace}
      async: true
      sample-rate: ${FISH_RAG_TRACING_SAMPLE_RATE:1.0}

  # ── 外部工具 ───────────────────────────────────────────────
  tools:
    # 工具结果治理：统一在 ToolRegistry 做智能截断和长结果提示
    max-result-chars: 4000
    hint-threshold-chars: 1500
    overrides:
      web_fetch: 6000
      file_read: 8000
      web_search: 3000
    # Tavily 搜索：https://docs.tavily.com/documentation/api-reference/endpoint/search
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: https://api.tavily.com
      max-results: 5
    # 博查 AI 搜索：https://open.bochaai.com/
    bocha:
      api-key: ${BOCHA_API_KEY:}
      base-url: https://api.bochaai.com
      count: 5
    # 高德地图 API：https://lbs.amap.com/api/webservice/guide/api/georegeo (地理编码)
    #                https://lbs.amap.com/api/webservice/guide/api-advanced/weatherinfo (天气)
    amap:
      key: ${AMAP_KEY:}
      base-url: https://restapi.amap.com

  # ── RustFS 对象存储（S3 兼容） ──────────────────────────────
  rustfs:
    enabled: ${RUSTFS_ENABLED:true}
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY:}
    secret-key: ${RUSTFS_SECRET_KEY:}
    bucket-chat: ${RUSTFS_BUCKET_CHAT:fish-chat}
    bucket-docs: ${RUSTFS_BUCKET_DOCS:fish-docs}

  # ── 对话限流（Redis Lua：令牌桶 + SSE 并发） ────────────────
  rate-limit:
    enabled: ${FISH_RATE_LIMIT_ENABLED:true}
    token-bucket:
      capacity: ${FISH_RATE_LIMIT_TOKEN_BUCKET_CAPACITY:60}
      refill-rate: ${FISH_RATE_LIMIT_TOKEN_BUCKET_REFILL_RATE:1.0}
      key-ttl: ${FISH_RATE_LIMIT_TOKEN_BUCKET_KEY_TTL:120}
    sse-concurrent:
      max-connections: ${FISH_RATE_LIMIT_SSE_MAX_CONNECTIONS:2}
      key-ttl: ${FISH_RATE_LIMIT_SSE_KEY_TTL:300}

  # ── 登录鉴权（Session 存 Redis，X-Auth-Token 头） ──────────
  auth:
    session-ttl-seconds: ${AUTH_SESSION_TTL:86400}
    session-key-prefix: fish:session
    white-list: /api/auth/login,/api/auth/register,/api/auth/logout

  # ── 知识库 ─────────────────────────────────────────────────
  knowledge:
    public-index-name: ${KNOWLEDGE_PUBLIC_INDEX:fish-public-knowledge}
    user-knowledge-index-name: ${KNOWLEDGE_USER_INDEX:fish-user-knowledge}
    document-ingest-stream-key: ${FISH_DOC_INGEST_STREAM:fish:doc:ingest}
    compensation:
      enabled: ${KNOWLEDGE_COMPENSATION_ENABLED:true}
      timeout-minutes: ${KNOWLEDGE_COMPENSATION_TIMEOUT_MINUTES:10}
